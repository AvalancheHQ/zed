# Continuous performance measurement with CodSpeed.
# Unlike most workflows in this directory, this one is not generated by
# `cargo xtask workflows`; edit it directly.
name: codspeed
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
on:
  pull_request:
    branches:
    - '**'
  push:
    branches:
    - main
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # for OpenID Connect authentication with CodSpeed
      id-token: write
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
      with:
        egress-policy: audit
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: Setup Rust toolchain, cache and cargo-codspeed
      uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
      with:
        cache-target: release
        bins: cargo-codspeed
    - name: Build the benchmark targets
      run: "cargo codspeed build --measurement-mode simulation --locked -p fuzzy_nucleo -p language -p rope -p streaming_diff -p text"
    - name: Run the benchmarks
      uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
      with:
        mode: simulation
        run: "cargo codspeed run -p fuzzy_nucleo -p language -p rope -p streaming_diff -p text"
